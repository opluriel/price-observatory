name: Collecte quotidienne

# Chaque jour : aligne la base sur les référentiels, puis vérifie les 3 dernières semaines terminées.
# Idempotent : un PDF déjà chargé est ignoré. Une semaine pas encore publiée n'est pas une erreur.
# Si une semaine est REJETÉE (nouveau produit, mise en page changée...), le job échoue et GitHub t'écrit.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      weeks_back:
        description: "Nombre de semaines terminées à revérifier"
        default: "3"

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WEEKS_BACK: ${{ inputs.weeks_back || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations et référentiels
        run: python -m src.admin setup
      - name: Collecte et chargement
        run: python -m src.pipeline --weeks-back "$WEEKS_BACK"
